[project]
name = "spezi-kit"
version = "0.1.0"
description = "Check and manage the specs of a project: the spezi command and its MCP server."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4",
    "mcp>=2,<3",
    "pygls>=2.1,<3",
    "questionary>=2",
    "rich>=13",
    "tomlkit>=0.13",
]

[project.scripts]
spezi = "spezi.cli:main"
specs = "spezi.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spezi = ["data/*", "data/editors/zed/*", "data/editors/zed/src/*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "ANN", "RUF100", "D",
    "C4", "PERF401", "PERF402", "SIM108", "RET", "PLW2901", "FURB",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "error"
reportDeprecated = "error"
reportUnnecessaryCast = "error"
reportUnusedVariable = "error"
reportConstantRedefinition = "error"
reportMissingTypeArgument = "error"
reportMissingParameterType = "error"
reportMatchNotExhaustive = "error"
include = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
