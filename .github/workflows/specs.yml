name: specs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix run . -- check
      - run: nix develop -c ruff check src
      - run: nix develop -c ruff format --check src
      - run: nix develop -c basedpyright
