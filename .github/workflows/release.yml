name: release

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#vsix && cp result/spezi.vsix spezi.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: spezi.vsix

  binary:
    needs: vsix
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    name: binary ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: src/spezi/data
      - run: python -m pip install . pyinstaller
      - run: >
          pyinstaller --onefile --name spezi --collect-data spezi --collect-submodules spezi
          src/spezi/__main__.py
      - name: smoke test
        run: |
          exe=dist/spezi
          [ -f dist/spezi.exe ] && exe=dist/spezi.exe
          "$exe" --help
          "$exe" check
      - name: name the binary
        run: |
          mkdir out
          if [ -f dist/spezi.exe ]; then
            cp dist/spezi.exe "out/spezi-${{ matrix.target }}.exe"
          else
            cp dist/spezi "out/spezi-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: out/*

  pypi:
    needs: binary
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: out
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes out/*
        env:
          GH_TOKEN: ${{ github.token }}
